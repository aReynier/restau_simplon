name: CI restauSimplon

on:
  push:
    branches: [ main, develop, feature/experiment-test-ci-cd ]
  pull_request:
    branches: [ main ]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Recuperer code
              uses: actions/checkout@v3

            - name: Parametrer python
              uses: actions/setup-python@v3
              with:
                python-version: '3.12'

            - name: Installer les dependances
              run: |
                python -m pip install --upgrade pip
                pip install pytest
                pip install -r requirements.txt

            - name: Lancer les tests avec pytest
              run: pytest
