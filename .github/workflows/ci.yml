name: CI/CD restauSimplon

on:
  push:
    branches: [ main, develop, feature/experiment-test-ci-cd ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
        - name: Récuperer le code
          uses: actions/checkout@v4

        - name: Mise en place de Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: build du stage test de Docker
          run: docker build -f Dockerfile.tests --target tester -t app:tests .

        - name: Lancer les tests
          run: docker run --rm -v ${{ github.workspace }}/reports:/app/reports app:tests

        - name: Charger le rapport de tests
          uses: actions/upload-artifact@v4 # Action pour sauvegarder le rapport
          with:
            name: pytest-reports
            path: pytest-report.xml
            # télécharge le rapport de test même si les tests échouent
          if: ${{ always() }}   


  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
        - name: Récupérer le code
          uses: actions/checkout@v4

        - name: Mise en place de Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Se logger dans le github container registry
          uses: docker/login-action@v3
          with: 
            registry: ghcr.io
            #Prend automatiquement en compte l'utilisateur qui a déclanché le workflow
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Extraire les métadata pour Docker
          id: meta
          uses: docker/metadata-action@v5
          with:
            images: ghcr.io/${{ github.repository_owner }}/restau_simplon

            tags: |
              type=sha,prefix=
              type=raw,value=latest,enable={{is_default_branch}}
   
        - name: Build et push de l'image Docker
          uses: docker/build-push-action@v6
          with:
            context: . # Le contexte de build (où se trouve le Dockerfile)
            file: ./Dockerfile.tests # Chemin vers votre Dockerfile
            push: true # Pousser l'image après le build
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
            cache-from: type=gha # Utiliser le cache Docker de GitHub Actions
            cache-to: type=gha,mode=max

